services:
  igc-competition:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  newt:
    image: fosrl/newt:latest
    environment:
      PANGOLIN_ENDPOINT: ${PANGOLIN_ENDPOINT:?Set PANGOLIN_ENDPOINT in .env}
      NEWT_ID: ${NEWT_ID:?Set NEWT_ID in .env}
      NEWT_SECRET: ${NEWT_SECRET:?Set NEWT_SECRET in .env}
    restart: unless-stopped